name: Build and publish Tenacity APT repository

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Instalar dependências base do contentor
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl python3

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Obter versão e verificar se já está publicada
        id: get_version
        run: |
          RELEASE_JSON=$(curl -s https://codeberg.org/api/v1/repos/tenacityteam/tenacity/releases/latest)
          VERSION=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; data=json.loads(sys.stdin.read(), strict=False); print(data.get('tag_name',''))")
          if [ -z "$VERSION" ]; then
            echo "::error::Não foi possível obter a versão mais recente do Codeberg."
            exit 1
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão mais recente: $VERSION"

          DEB_URL="https://tiagocasalribeiro.github.io/tenacity-apt/pool/main/t/tenacity/tenacity_${VERSION}_amd64.deb"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEB_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "✅ Versão $VERSION já está publicada. Nada a fazer."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "🆕 Versão $VERSION ainda não publicada. Vai compilar."
          fi

      - name: Instalar ferramentas e dependências de build
        if: steps.get_version.outputs.already_published == 'false'
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file \
            dpkg-dev apt-utils gnupg \
            libavcodec-dev libavformat-dev libavutil-dev libflac++-dev \
            libglib2.0-dev libgtk-3-dev libid3tag0-dev libjack-jackd2-dev \
            liblilv-dev libmad0-dev libmp3lame-dev libogg-dev libpng-dev \
            portaudio19-dev libportmidi-dev libportsmf-dev libserd-dev \
            libsndfile1-dev libsord-dev libsoundtouch-dev libsoxr-dev \
            libsuil-dev libtwolame-dev vamp-plugin-sdk libvorbis-dev lv2-dev \
            zlib1g-dev libjpeg-dev libtiff-dev liblzma-dev libsqlite3-dev \
            libzip-dev zipcmp zipmerge ziptool rapidjson-dev \
            wx-common wx3.2-headers libwxgtk3.2-dev \
            libjsoncpp-dev libsbsms-dev libmpg123-dev

      - name: Clonar o código-fonte com submódulos
        if: steps.get_version.outputs.already_published == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git clone --depth 1 --branch "v${VERSION}" \
            https://codeberg.org/tenacityteam/tenacity.git tenacity-source

          cd tenacity-source
          git config --global --add safe.directory "$PWD"
          git submodule update --init --recursive
          git submodule status
          ls -la lib-src/

      - name: Compilar o Tenacity
        if: steps.get_version.outputs.already_published == 'false'
        run: |
          cd tenacity-source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Gerar o pacote .deb
        if: steps.get_version.outputs.already_published == 'false'
        run: |
          cd tenacity-source

          sed -i 's/^[Ss][Ee][Tt](CPACK_PACKAGE_NAME .*/set(CPACK_PACKAGE_NAME "tenacity")/' build/CPackConfig.cmake
          grep -i "CPACK_PACKAGE_NAME" build/CPackConfig.cmake

          cpack --config build/CPackConfig.cmake -G DEB \
            -D CPACK_PACKAGE_CONTACT="Tiago Casal Ribeiro <79724578+tiagocasalribeiro@users.noreply.github.com>" \
            -D CPACK_DEBIAN_PACKAGE_MAINTAINER="Tiago Casal Ribeiro <79724578+tiagocasalribeiro@users.noreply.github.com>" \
            -D CPACK_DEBIAN_PACKAGE_REPLACES="audacity, audacity-data" \
            -D CPACK_DEBIAN_PACKAGE_CONFLICTS="audacity, audacity-data" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON

          DEB_ORIG=$(find build -name "*.deb" | head -n 1)
          if [ -z "$DEB_ORIG" ]; then
            echo "::error::Nenhum pacote .deb foi gerado pelo cpack."
            exit 1
          fi

          PKG_NAME=$(dpkg-deb -f "$DEB_ORIG" Package)
          PKG_VERSION=$(dpkg-deb -f "$DEB_ORIG" Version)
          PKG_ARCH=$(dpkg-deb -f "$DEB_ORIG" Architecture)
          echo "Pacote: $PKG_NAME $PKG_VERSION ($PKG_ARCH)"

          echo "=== Depends geradas ==="
          dpkg-deb -f "$DEB_ORIG" Depends
          echo "========================"

          NEW_NAME="${PKG_NAME}_${PKG_VERSION}_${PKG_ARCH}.deb"
          mv "$DEB_ORIG" "$GITHUB_WORKSPACE/$NEW_NAME"
          ls -la "$GITHUB_WORKSPACE"/*.deb

      - name: Importar chave GPG
        if: steps.get_version.outputs.already_published == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Criar estrutura do site APT
        if: steps.get_version.outputs.already_published == 'false'
        run: |
          mkdir -p site/pool/main/t/tenacity
          mkdir -p site/dists/stable/main/binary-amd64
          cp "$GITHUB_WORKSPACE"/*.deb site/pool/main/t/tenacity/
          gpg --export --armor "$GPG_KEY_ID" > site/KEY.gpg

      - name: Gerar metadados APT
        if: steps.get_version.outputs.already_published == 'false'
        run: |
          cd site
          dpkg-scanpackages --arch amd64 pool/main /dev/null \
            > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          cat > /tmp/ftp-release.conf << EOF
          APT::FTPArchive::Release::Origin "Tenacity Unofficial";
          APT::FTPArchive::Release::Label "Tenacity";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "Unofficial Debian packages for Tenacity";
          EOF

          cd dists/stable
          apt-ftparchive release -c=/tmp/ftp-release.conf . > Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

          if [ ! -s main/binary-amd64/Packages ]; then
            echo "::error::Ficheiro Packages está vazio!"
            exit 1
          fi
          head -20 main/binary-amd64/Packages

      - name: Configurar GitHub Pages
        if: steps.get_version.outputs.already_published == 'false'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.get_version.outputs.already_published == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        if: steps.get_version.outputs.already_published == 'false'
        uses: actions/deploy-pages@v4
